<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이광복 — 영상 디자이너</title>
    <meta name="description" content="영상 디자이너 이광복의 작업물 모음" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>"
    />
  </head>
  <body>
    <div class="banner" aria-hidden="true"></div>

    <div class="shell">
      <!-- 왼쪽 프로필 : config.js 또는 Supabase 의 profile 로 채워집니다 -->
      <aside class="profile" id="profile"></aside>

      <main>
        <div class="works-head">
          <h2>작업</h2>
          <span class="count" id="works-count"></span>
        </div>
        <div class="works" id="works">
          <p class="state">불러오는 중…</p>
        </div>
      </main>
    </div>

    <footer class="footer">
      <span id="footer-name"></span>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
