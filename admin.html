<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>어드민</title>
    <link rel="stylesheet" href="admin.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>"
    />
  </head>
  <body>
    <div class="page page--admin">
      <!-- 준비 중 / 설정 안 됨 -->
      <p class="state" id="boot">준비 중…</p>

      <!-- 로그인 -->
      <section class="login" id="login" hidden>
        <h1>어드민</h1>
        <p class="login-desc">작업물과 프로필을 고칩니다.</p>
        <form id="login-form" autocomplete="on">
          <label>
            이메일
            <input type="email" id="login-email" required autocomplete="username" />
          </label>
          <label>
            비밀번호
            <input
              type="password"
              id="login-password"
              required
              autocomplete="current-password"
            />
          </label>
          <button type="submit" class="btn btn--primary" id="login-submit">
            들어가기
          </button>
          <p class="form-error" id="login-error" hidden></p>
        </form>
      </section>

      <!-- 어드민 본체 -->
      <div id="panel" hidden>
        <header class="admin-top">
          <div>
            <h1>어드민</h1>
            <p class="admin-who" id="admin-who"></p>
          </div>
          <div class="admin-top-actions">
            <a class="btn" href="./" target="_blank" rel="noopener">사이트 보기 ↗</a>
            <button class="btn" id="logout">로그아웃</button>
          </div>
        </header>

        <nav class="tabs">
          <button class="tab is-active" data-tab="works">작업물</button>
          <button class="tab" data-tab="profile">프로필</button>
        </nav>

        <!-- ── 작업물 ───────────────────────────────────── -->
        <section id="tab-works">
          <div class="bar">
            <button class="btn btn--primary" id="new-work">+ 새 작업물</button>
            <span class="hint">손잡이(⠿)를 잡고 끌면 순서가 바뀝니다</span>
          </div>

          <!-- 추가 · 수정 폼 -->
          <form class="editor" id="work-form" hidden>
            <h2 id="work-form-title">새 작업물</h2>

            <label>
              <span class="label-row">제목 <span class="req">필수</span></span>
              <input type="text" id="w-title" required maxlength="120" />
            </label>

            <label>
              한 줄 설명
              <input type="text" id="w-summary" maxlength="200" />
              <small>역할·연도까지 여기에. 예) 2025 · 편집 · 모션그래픽</small>
            </label>

            <label>
              썸네일 이미지 주소
              <input type="url" id="w-image" placeholder="https://..." />
              <small>비워두면 🎬 아이콘이 대신 들어갑니다</small>
            </label>

            <label>
              상세 링크
              <input type="url" id="w-link" placeholder="https://..." />
              <small>비메오·유튜브·노션 등. 비우면 카드가 안 눌립니다</small>
            </label>

            <label class="check">
              <input type="checkbox" id="w-visible" checked />
              사이트에 보이기
            </label>

            <div class="editor-actions">
              <button type="submit" class="btn btn--primary" id="work-save">저장</button>
              <button type="button" class="btn" id="work-cancel">취소</button>
              <p class="form-error" id="work-error" hidden></p>
            </div>
          </form>

          <div id="works-list" class="admin-list"></div>
          <p class="state" id="works-empty" hidden>
            아직 작업물이 없습니다. 위의 "+ 새 작업물" 을 눌러 하나 추가해보세요.
          </p>
        </section>

        <!-- ── 프로필 ───────────────────────────────────── -->
        <section id="tab-profile" hidden>
          <form class="editor" id="profile-form">
            <label>
              이름
              <input type="text" id="p-name" maxlength="60" />
            </label>
            <label>
              직군 한 줄
              <input type="text" id="p-role" maxlength="60" />
            </label>
            <label>
              소개
              <textarea id="p-intro" rows="3" maxlength="300"></textarea>
              <small>채용 담당자가 5초 안에 읽는 부분입니다</small>
            </label>
            <label>
              이메일
              <input type="email" id="p-email" maxlength="120" />
            </label>

            <div class="links-block">
              <span class="links-label">외부 링크</span>
              <div id="p-links"></div>
              <button type="button" class="btn btn--small" id="add-link">
                + 링크 추가
              </button>
            </div>

            <div class="editor-actions">
              <button type="submit" class="btn btn--primary" id="profile-save">
                저장
              </button>
              <p class="form-note" id="profile-note" hidden></p>
            </div>
          </form>
        </section>
      </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="admin.js"></script>
  </body>
</html>
